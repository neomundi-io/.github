<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1102 118" width="100%" height="auto" role="img" aria-label="NeoMundi product journey in five steps: INSTALL, pip install neomundi; TRACE, one observation per interaction; MEASURE, 5 signals with provenance; VERIFY, hash and signature, no key needed; ACT, export, attest and hand over." font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><title>NeoMundi product journey in five steps: INSTALL, pip install neomundi; TRACE, one observation per interaction; MEASURE, 5 signals with provenance; VERIFY, hash and signature, no key needed; ACT, export, attest and hand over.</title><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#94a3b8" /></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#94a3b8" /></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#94a3b8" /></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#94a3b8" /></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#94a3b8" /></marker></defs><g><rect x="8" y="14" width="190" height="90" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5" /><rect x="8" y="14" width="4" height="90" rx="2" fill="#64748b" /><text x="103.0" y="45" text-anchor="middle" font-size="19" font-weight="700" fill="#64748b" letter-spacing="0.6">INSTALL</text><text x="103.0" y="70" text-anchor="middle" font-size="12.5" fill="#475569" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace">pip