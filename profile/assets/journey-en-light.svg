idth="1.5" /><rect x="904" y="14" width="4" height="90" rx="2" fill="#0f766e" /><text x="999.0" y="45" text-anchor="middle" font-size="19" font-weight="700" fill="#0f766e" letter-spacing="0.6">ACT</text><text x="999.0" y="70" text-anchor="middle" font-size="13" fill="#475569">export · attest</text><text x="999.0" y="89" text-anchor="middle" font-size="13" fill="#475569">hand over</text></g></svg>